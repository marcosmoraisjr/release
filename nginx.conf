server {
    listen 80;
    server_name _;
    root /data;
    autoindex off;

    # Pacotes têm a versão no nome e nunca mudam.
    location ~* \.nupkg$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Índices e instaladores mudam a cada versão: nada de cache, senão a atualização atrasa.
    location ~* (releases\.[^/]*\.json|/RELEASES|assets\.[^/]*\.json|Setup\.exe|Portable\.zip)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri =404;
    }
}
